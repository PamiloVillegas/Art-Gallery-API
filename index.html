<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Art Gallery API</title>
  </head>

  <body class="bg-yellow-200 text-slate-100 min-h-screen font-serif">
    <header
      class="bg-contain bg-center text-center p-8 border-b border-white relative"
      style="background-image: url(&quot;Imagen Art Gallery.png&quot;)"
    >
      <!-- Capa oscura -->

      <div
        class="absolute inset-0 bg-gradient-to-l from-black/60 via-black/30 to-transparent"
      ></div>

      <!-- Contenido -->

      <div class="relative z-10">
        <h1
          class="text-6xl font-extrabold text-white tracking-widest drop-shadow-2xl"
        >
          ART GALLERY API
        </h1>

        <div class="flex justify-center gap-6 mt-10">
          <button
            id="btnAnterior"
            class="bg-zinc-400 hover:bg-zinc-300 text-white px-5 py-2 rounded"
          >
            Anterior
          </button>

          <span id="pagina" class="text-white text-2xl font-bold"> </span>

          <button
            id="btnSiguiente"
            class="bg-zinc-400 hover:bg-zinc-300 text-white px-5 py-2 rounded"
          >
            Siguiente
          </button>
        </div>
      </div>
    </header>

    <main>
      <!-- Panel de busqueda -->
      <div class="bg-white flex items-end gap-4 p-4">
        <div class="w-80">
          <label for="departamento" class="text-gray-400 block mb-1">
            Departamento
          </label>
          <select
            id="departamento"
            class="text-gray-300 w-full border rounded border-gray-300 px-3 py-2 placeholder-gray-300"
          >
            <option value="">Todos los departamentos</option>
          </select>
        </div>

        <div class="w-96">
          <label for="titulo" class="text-gray-400 block mb-1"> Título </label>
          <input
            type="text"
            id="titulo"
            placeholder="Buscar por título..."
            class="w-full border rounded border-gray-300 px-3 py-2 placeholder-gray-300"
          />
        </div>

        <button id="btnBuscar" class="bg-blue-600 text-white px-6 py-2 rounded">
          Buscar
        </button>

        <button
          id="btnFavoritos"
          class="bg-yellow-500 text-white px-4 py-2 rounded"
        >
          ⭐ Ver Favoritos
        </button>
      </div>

      <!-- Aquí aparecen las tarjetas -->
      <div
        id="obra-contenedor"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 p-6"
      ></div>

      <!-- Modal flotante -->

      <div
        id="modal"
        class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50"
      >
        <div
          class="bg-white border border-yellow-200 rounded-lg p-6 w-96 relative"
        >
          <!-- Botón cerrar -->

          <button
            id="btnCerrar"
            class="absolute top-2 right-3 text-black text-2xl font-bold hover:text-red-500"
          >
            X
          </button>

          <!-- Aquí aparecen los detalles -->

          <div id="detalle"></div>
          <div class="text-center">
            <img
              id="btnFavorito"
              src="estrella-vacia.png"
              class="w-10 h-10 mx-auto cursor-pointer hover:scale-110 transition"
            />
          </div>
        </div>
      </div>
    </main>

    <script src="artgalleryAPI.js"></script>
  </body>
</html>
